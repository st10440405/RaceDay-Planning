name: RaceDay API CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore Part2/RaceDay.sln
      - name: Build
        run: dotnet build Part2/RaceDay.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Part2/RaceDay.sln --configuration Release --no-build --verbosity normal
